name: Generate AI Semantic Vault with Gemini

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:
    inputs:
      batches_per_tier:
        description: 'Nombre de lots par palier (5 lots = ~200 énigmes/tier)'
        required: true
        default: '5'
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-ai-vault:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du depot
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generation des Enigmes IA par Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BATCH_COUNT: ${{ github.event.inputs.batches_per_tier || '5' }}
        run: |
          cat << 'EOF' > generate_ai_vault.js
          const fs = require('fs');
          const https = require('https');
          const zlib = require('zlib');
          const path = require('path');

          const API_KEY = process.env.GEMINI_API_KEY;
          if (!API_KEY) {
            console.error("ERREUR : GEMINI_API_KEY est introuvable dans les Secrets GitHub !");
            process.exit(1);
          }

          const BATCHES = parseInt(process.env.BATCH_COUNT || '5', 10);

          const TIERS = [
            { id: 1, name: 'tier1_facile', diff: 'Niveau Debutant (Niv 1-10) : Objets du quotidien, nature evidente, actions familieres, animaux, meteo. Mots simples.' },
            { id: 2, name: 'tier2_moyen', diff: 'Niveau Intermediaire (Niv 11-30) : Metiers, sciences, sports, geographie, cuisine, culture, techniques.' },
            { id: 3, name: 'tier3_difficile', diff: 'Niveau Avance (Niv 31-60) : Concepts abstraits, physique, psychologie, histoire, mecanismes complexes, emotions.' },
            { id: 4, name: 'tier4_expert', diff: 'Niveau Expert / Maitre (Niv 61-100+) : Litterature, mythologie, vocabulaire noble, alchimie, metaphores subtiles, philosophie.' }
          ];

          const THEMES = [
            "Sciences & Espace", "Nature & Animaux", "Histoire & Civilisations",
            "Cuisine & Terroir", "Arts & Musique", "Sports & Aventure",
            "Objets & Outils", "Sensations & Emotions", "Litterature & Mythes"
          ];

          function callGemini(prompt) {
            return new Promise((resolve, reject) => {
              const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;
              const payload = JSON.stringify({
                contents: [{ parts: [{ text: prompt }] }],
                generationConfig: {
                  temperature: 0.85,
                  responseMimeType: "application/json"
                }
              });

              const req = https.request(url, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Content-Length': Buffer.byteLength(payload)
                }
              }, (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  try {
                    const parsed = JSON.parse(data);
                    const text = parsed.candidates[0].content.parts[0].text;
                    resolve(JSON.parse(text));
                  } catch (e) {
                    reject(new Error("Reponse Gemini invalide : " + data));
                  }
                });
              });

              req.on('error', reject);
              req.write(payload);
              req.end();
            });
          }

          async function sleep(ms) {
            return new Promise(r => setTimeout(r, ms));
          }

          async function run() {
            fs.mkdirSync('vault_packs', { recursive: true });
            let globalId = 1;

            for (const tier of TIERS) {
              console.log(`\n=== Generation IA pour ${tier.name} ===`);
              const pool = [];
              const seenCombos = new Set();

              for (let b = 0; b < BATCHES; b++) {
                const theme = THEMES[b % THEMES.length];
                console.log(`[Palier ${tier.id}] Lot ${b + 1}/${BATCHES} (Theme: ${theme})...`);

                const prompt = `Tu es le concepteur en chef du jeu de reflexion "2Mots".
Tu dois generer un tableau JSON contenant 30 enigmes semantiques 100% FRANCAISES, HAUTEMENT LOGIQUES, INGENIEUSES et SANS AUCUNE INCOHERENCE.

Difficulte requise : ${tier.diff}
Thematique prioritaire : ${theme}

REGLES ABSOLUES :
1. LIEN SEMANTIQUE PARFAIT : word1 + word2 doivent mener incontestablement a "answer" (Ex: SOLEIL + PLUIE -> ARC-EN-CIEL, VOLANT + PLUME -> BADMINTON, VOLCAN + LAVE -> EXPLOSER).
2. NATURE GRAMMATICALE IDENTIQUE : answer, distractor1 et distractor2 DOIVENT avoir STRICTEMENT la meme nature (3 verbes a l infinitif, 3 noms, ou 3 adjectifs).
3. INDICE CONTEXTUEL : L indice ("clue") doit decrire la passerelle sans reveler la reponse brute.
4. DISTRACTEURS DU MEME UNIVERS : Les leurres doivent etre plausibles dans le meme domaine.

Format JSON attendu :
[
  {
    "word1": "VOLANT",
    "word2": "PLUME",
    "answer": "BADMINTON",
    "clue": "Sport de raquette rapide et aerien",
    "difficulty": ${tier.id === 1 ? 1 : tier.id === 2 ? 4 : tier.id === 3 ? 7 : 9},
    "type": "nom",
    "distractor1": "TENNIS",
    "distractor2": "SQUASH"
  }
]`;

                try {
                  const enigmas = await callGemini(prompt);
                  if (Array.isArray(enigmas)) {
                    for (const item of enigmas) {
                      if (!item.word1 || !item.word2 || !item.answer) continue;
                      const w1 = String(item.word1).toUpperCase().trim();
                      const w2 = String(item.word2).toUpperCase().trim();
                      const ans = String(item.answer).toUpperCase().trim();
                      const key = `${w1}#${w2}#${ans}`;
                      if (seenCombos.has(key)) continue;
                      seenCombos.add(key);

                      const d1 = String(item.distractor1 || 'CHOIX A').toUpperCase().trim();
                      const d2 = String(item.distractor2 || 'CHOIX B').toUpperCase().trim();

                      pool.push([
                        globalId++,
                        w1,
                        w2,
                        ans,
                        item.clue || "Point commun semantique",
                        item.difficulty || (tier.id * 2),
                        item.type || "nom",
                        d1,
                        d2
                      ]);
                    }
                    console.log(` -> Total accumule: ${pool.length} enigmes.`);
                  }
                } catch (err) {
                  console.warn(`Avertissement sur le lot ${b + 1}:`, err.message);
                }

                await sleep(2000);
              }

              const raw = JSON.stringify(pool);
              const gz = zlib.gzipSync(Buffer.from(raw));
              const destPath = path.join('vault_packs', `${tier.name}.json.gz`);
              fs.writeFileSync(destPath, gz);
              console.log(`[Succes] ${tier.name}.json.gz sauvegarde (${pool.length} enigmes, ${(gz.length / 1024).toFixed(1)} Ko).`);
            }
          }

          run().catch((err) => {
            console.error("Erreur critique :", err);
            process.exit(1);
          });
          EOF

          node generate_ai_vault.js

      - name: Publication automatique dans la Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vault-v${{ github.run_number }}
          name: Semantic Vault v${{ github.run_number }} (AI Generated)
          draft: false
          prerelease: false
          files: vault_packs/*.json.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
