const TIERS_CONFIG = [
  { id: 1, name: "tier1_facile" },
  { id: 2, name: "tier2_moyen" },
  { id: 3, name: "tier3_difficile" },
  { id: 4, name: "tier4_expert" }
];

// GENERATEUR DE DISTRACTEURS SÉMANTIQUES DYNAMIQUES
function pickDistractors(dists, count = 2) {
  const shuffled = [...dists].sort(() => Math.random() - 0.5);
  return shuffled.slice(0, count);
}

// GENERATEUR STREAM POUR LE PIPELINE ZLIB
async function* generateUniquePuzzles(seeds, startGlobalId) {
  const seenCombos = new Set();
  let currentId = startGlobalId;

  for (const rel of seeds) {
    for (const w1 of rel.w1s) {
      for (const w2 of rel.w2s) {
        // Clé unique pour interdire formellement les doublons
        const comboKey = `${w1}#${w2}#${rel.ans}`;
        if (seenCombos.has(comboKey)) continue;
        seenCombos.add(comboKey);

        const clue = rel.clues[Math.floor(Math.random() * rel.clues.length)];
        const [d1, d2] = pickDistractors(rel.dists, 2);

        // Format tableau compact sérialisé en NDJSON (Newline Delimited JSON)
        const record = [
          currentId++,
          w1,
          w2,
          rel.ans,
          clue,
          rel.diff,
          rel.type,
          d1,
          d2
        ];

        yield JSON.stringify(record) + '\n';
      }
    }
  }
}

async function run() {
  const outputDir = path.resolve('vault_packs');
  if (!fs.existsSync(outputDir)) {
    fs.mkdirSync(outputDir, { recursive: true });
  }

  let globalId = 1;

  for (const config of TIERS_CONFIG) {
    const seeds = KNOWLEDGE_GRAPH.filter(r => r.tier === config.id);
    const destinationPath = path.join(outputDir, `${config.name}.ndjson.gz`);
    
    console.log(`[Traitement] Génération cartésienne pour : ${config.name}...`);

    const readable = Readable.from(generateUniquePuzzles(seeds, globalId));
    const gzip = zlib.createGzip({ level: 9 });
    const writeStream = fs.createWriteStream(destinationPath);

    await pipeline(readable, gzip, writeStream);

    const stats = fs.statSync(destinationPath);
    const sizeMb = (stats.size / 1024 / 1024).toFixed(2);
    console.log(`[Succès] ${config.name}.ndjson.gz finalisé (${sizeMb} Mo)`);
  }
}

run().catch((err) => {
  console.error("Erreur critique durant la construction du vault :", err);
  process.exit(1);
});
