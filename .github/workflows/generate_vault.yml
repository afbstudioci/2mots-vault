name: Generate AI Semantic Vault

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-ai-vault:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du depot
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installation du SDK Officiel Google Gemini
        run: npm install @google/generative-ai

      - name: Execution du Generateur IA
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node generator.js

      - name: Publication dans la Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest AI Semantic Vault
          draft: false
          prerelease: false
          files: vault_packs/*.json.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
